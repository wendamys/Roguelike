name: Development & Stage CI/CD

on:
  push:
    branches: [ "develop", "**" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Tests with Gradle
        run: |
          chmod +x gradlew
          ./gradlew test

  deploy-to-staging:
    needs: test-code
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        run: |
          echo "Автоматический деплой на тестовый стенд (Staging)..."
