plugins {
    id 'java'
    id 'application' // Обязательный плагин для запуска приложения через Gradle
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Подключаем Lanterna вместо старого JCurses
    implementation 'com.googlecode.lanterna:lanterna:3.1.2'
    // Подключаем Gson
    implementation('com.google.code.gson:gson:2.14.0')

    // Зависимости для автоматических тестов JUnit 5
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Зависимости для Mockito (Добавлены для тестов рюкзака)
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

test {
    useJUnitPlatform()
}

application {
    // Главный класс вашего приложения
    mainClass = 'presentation.Main'
}
